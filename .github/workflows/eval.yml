name: Eval Suite

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_suite:
        description: "Run full 30-prompt suite instead of 1/3 smoke test"
        type: boolean
        default: false

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run smoke test (on every push)
        if: github.event_name == 'push'
        run: python -u eval_harness.py --endpoint ${{ secrets.EC2_ENDPOINT }}/predict --smoke

      - name: Run full suite (manual trigger only)
        if: github.event_name == 'workflow_dispatch' && inputs.full_suite
        run: python -u eval_harness.py --endpoint ${{ secrets.EC2_ENDPOINT }}/predict

      - name: Run smoke test (manual trigger, default)
        if: github.event_name == 'workflow_dispatch' && !inputs.full_suite
        run: python -u eval_harness.py --endpoint ${{ secrets.EC2_ENDPOINT }}/predict --smoke